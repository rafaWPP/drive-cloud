name: Validate Drive Cloud
on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install frontend dependencies
        run: npm install --no-audit --no-fund
      - name: Build frontend
        run: npm run build
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile Python backend
        run: python -m py_compile backend/server.py backend/storage_api.py backend/backup_api.py backend/share_api.py backend/media_ranges.py
      - name: Test video byte-range handling
        run: PYTHONPATH=backend python -m unittest discover -s backend/tests -p 'test_*.py' -v
