name: Linux Desktop (Tauri)
on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
      - feature/tauri-desktop-linux
  push:
    branches:
      - feature/tauri-desktop-linux
      - feature/catalog-telegram-sync
    paths:
      - 'src/**'
      - 'public/**'
      - 'backend/**'
      - 'src-tauri/**'
      - 'package.json'
      - 'index.html'
      - '.github/workflows/linux-desktop.yml'
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  package-linux:
    runs-on: ubuntu-22.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Dependências Linux para Tauri
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev librsvg2-dev libayatana-appindicator3-dev
      - name: Instalar dependências do frontend
        run: npm install
      - name: Verificar inicialização do frontend desktop
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync } from 'node:fs';
          import assert from 'node:assert/strict';
          const source = readFileSync('src/main.jsx', 'utf8');
          assert.match(source, /let backendOrigin='http:\/\/127\.0\.0\.1:8000';/);
          assert.doesNotMatch(source, /let backendOrigin=backendOrigin/);
          assert.match(source, /backendOrigin = await invoke\('backend_origin'\)/);
          assert.ok(source.includes('!/^[0-9]+$/.test(apiId.trim())'), 'API ID must accept decimal digits');
          assert.match(source, /await openUrl\("https:\/\/my\.telegram\.org\/apps"\)/);
          const backend = readFileSync('backend/server.py', 'utf8');
          assert.ok(backend.indexOf('load_dotenv(DATA / ".env", override=True)') < backend.indexOf('API_ID = int(os.environ.get('), 'Stored Telegram credentials must load before API initialization');
          const tauriConfig = JSON.parse(readFileSync('src-tauri/tauri.conf.json', 'utf8'));
          assert.equal(tauriConfig.app.windows[0].dragDropEnabled, false, 'Desktop must use HTML5 file drop');
          const style = readFileSync('src/style.css', 'utf8');
          assert.match(style, /main>header \.avatar\{margin-left:auto/, 'Profile avatar must remain pinned to right');
          console.log('Desktop frontend origin initialization OK');
          NODE
      - name: Validar sintaxe do backend
        run: python -m compileall -q backend
      - name: Empacotar o backend Telegram (sem Python no computador do cliente)
        run: |
          python -m pip install -r backend/requirements.txt pyinstaller
          python -m PyInstaller --noconfirm --clean --onefile \
            --name drive-cloud-backend \
            --paths backend \
            --hidden-import server \
            --collect-submodules pillow_jxl \
            --collect-submodules telethon \
            --distpath build/desktop-sidecar \
            backend/desktop_entry.py
          mkdir -p src-tauri/binaries
          cp build/desktop-sidecar/drive-cloud-backend src-tauri/binaries/drive-cloud-backend-x86_64-unknown-linux-gnu
          chmod 755 src-tauri/binaries/drive-cloud-backend-x86_64-unknown-linux-gnu
      - name: Testar o executável local empacotado
        run: |
          mkdir -p /tmp/drive-cloud-ci-data
          DRIVE_CLOUD_DATA_DIR=/tmp/drive-cloud-ci-data DRIVE_CLOUD_BACKEND_PORT=48763 build/desktop-sidecar/drive-cloud-backend > /tmp/drive-cloud-sidecar.log 2>&1 &
          SIDECAR_PID=$!
          trap 'kill "$SIDECAR_PID" 2>/dev/null || true' EXIT
          READY=0
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:48763/api/telegram/status > /tmp/drive-cloud-status.json; then READY=1; break; fi
            if ! kill -0 "$SIDECAR_PID" 2>/dev/null; then break; fi
            sleep 1
          done
          if [ "$READY" != "1" ]; then
            cat /tmp/drive-cloud-sidecar.log
            test ! -f /tmp/drive-cloud-ci-data/backend-startup.log || cat /tmp/drive-cloud-ci-data/backend-startup.log
            exit 1
          fi
          grep -q '"configured":false' /tmp/drive-cloud-status.json
      - name: Testar conector empacotado após fechar e reabrir Linux
        run: python backend/tests/check_sidecar_lifecycle.py build/desktop-sidecar/drive-cloud-backend
      - name: Gerar ícones a partir da logo do projeto
        run: npx tauri icon public/drive-cloud-logo.svg
      - name: Verificar proteção de downloads nativos
        run: cargo test --manifest-path src-tauri/Cargo.toml --lib
      - name: Gerar instalador .deb
        run: npx tauri build --bundles deb
      - name: Publicar artefato de teste
        uses: actions/upload-artifact@v4
        with:
          name: drive-cloud-linux-deb-experimental
          path: src-tauri/target/release/bundle/deb/*.deb
          if-no-files-found: error
